
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent
  namespace: cicd
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

