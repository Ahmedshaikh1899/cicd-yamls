
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: cicd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 200:200 /nexus-data
              chmod -R u+rwX,g+rwX /nexus-data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data

      containers:
        - name: nexus
          image: sonatype/nexus3:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms512m -Xmx1024m
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
            - name: NEXUS_DATA
              value: /nexus-data

          resources:
            requests:
              cpu: 500m
              memory: 1200Mi
            limits:
              cpu: "1"
              memory: 2Gi

          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data

          startupProbe:
            httpGet:
              path: /
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
